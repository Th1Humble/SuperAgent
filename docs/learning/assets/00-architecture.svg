<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="100%" height="auto" role="img" aria-label="SuperAgent 整体运行架构图">
  <defs>
    <style>
      .font { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Inter", -apple-system, BlinkMacSystemFont, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#4169E1"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1C3152" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Canvas -->
  <rect x="1" y="1" width="1118" height="638" rx="16" fill="#F8FAFF" stroke="#E3E9F2" stroke-width="1.5"/>

  <!-- Header -->
  <text x="40" y="42" class="font" font-size="22" font-weight="750" fill="#17243B">SuperAgent 整体运行架构</text>
  <text x="40" y="66" class="font" font-size="13" fill="#5D6A80">所有消息入口收敛进同一套 agentLoop()，由 ToolRegistry 统一管理权限、并发锁、Hook 与结果截断</text>

  <!-- Column 1: Input Channels -->
  <text x="40" y="106" class="font" font-size="12" font-weight="700" fill="#7183AD" letter-spacing="1">输入入口</text>

  <g filter="url(#card-shadow)">
    <rect x="40" y="122" width="196" height="58" rx="10" fill="#FFFFFF" stroke="#DCE4F0" stroke-width="1.5"/>
    <text x="138" y="147" text-anchor="middle" class="font" font-size="14" font-weight="700" fill="#17243B">终端 CLI (readline)</text>
    <text x="138" y="167" text-anchor="middle" class="font" font-size="11.5" fill="#64748B">本地交互与斜杠命令</text>

    <rect x="40" y="198" width="196" height="58" rx="10" fill="#FFFFFF" stroke="#DCE4F0" stroke-width="1.5"/>
    <text x="138" y="223" text-anchor="middle" class="font" font-size="14" font-weight="700" fill="#17243B">飞书 / Dashboard</text>
    <text x="138" y="243" text-anchor="middle" class="font" font-size="11.5" fill="#64748B">ChannelGateway 适配</text>

    <rect x="40" y="274" width="196" height="58" rx="10" fill="#FFFFFF" stroke="#DCE4F0" stroke-width="1.5"/>
    <text x="138" y="299" text-anchor="middle" class="font" font-size="14" font-weight="700" fill="#17243B">Cron 定时任务</text>
    <text x="138" y="319" text-anchor="middle" class="font" font-size="11.5" fill="#64748B">按表达式定时唤醒</text>
  </g>

  <!-- Merge lines from Inputs to agentLoop -->
  <path d="M 236 151 L 274 151 L 274 303 L 236 303" fill="none" stroke="#94A3B8" stroke-width="1.8"/>
  <line x1="236" y1="227" x2="274" y2="227" stroke="#94A3B8" stroke-width="1.8"/>
  <line x1="274" y1="278" x2="324" y2="278" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="299" y="268" text-anchor="middle" class="font" font-size="11" font-weight="600" fill="#3158C9">消息</text>

  <!-- Column 2: PromptBuilder -> agentLoop <-> Model -->
  <g filter="url(#card-shadow)">
    <!-- PromptBuilder -->
    <rect x="330" y="102" width="296" height="90" rx="12" fill="#EFF4FF" stroke="#B8C9F8" stroke-width="1.5"/>
    <text x="478" y="128" text-anchor="middle" class="font" font-size="14" font-weight="700" fill="#1E3A8A">PromptBuilder 上下文管道</text>
    <rect x="344" y="142" width="84" height="32" rx="7" fill="#FFFFFF" stroke="#C7D7FE"/>
    <text x="386" y="162" text-anchor="middle" class="font" font-size="11.5" font-weight="600" fill="#3158C9">Memory 索引</text>
    <rect x="436" y="142" width="82" height="32" rx="7" fill="#FFFFFF" stroke="#C7D7FE"/>
    <text x="477" y="162" text-anchor="middle" class="font" font-size="11.5" font-weight="600" fill="#3158C9">RAG 摘要</text>
    <rect x="526" y="142" width="86" height="32" rx="7" fill="#FFFFFF" stroke="#C7D7FE"/>
    <text x="569" y="162" text-anchor="middle" class="font" font-size="11.5" font-weight="600" fill="#3158C9">Skill 正文</text>

    <!-- Arrow PromptBuilder -> agentLoop -->
    <line x1="478" y1="192" x2="478" y2="220" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="524" y="210" class="mono" font-size="11" fill="#3158C9">system prompt</text>

    <!-- Core: agentLoop -->
    <rect x="330" y="226" width="296" height="114" rx="14" fill="#FFFFFF" stroke="#4169E1" stroke-width="2.5"/>
    <rect x="416" y="236" width="124" height="20" rx="10" fill="#EEF2FF"/>
    <text x="478" y="250" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#3158C9">CORE RUNTIME</text>
    <text x="478" y="278" text-anchor="middle" class="font" font-size="18" font-weight="750" fill="#17243B">agentLoop() 主循环</text>
    <text x="478" y="301" text-anchor="middle" class="font" font-size="13" font-weight="600" fill="#3158C9">思考 (Think) → 调工具 (Act) → 观察 (Observe)</text>
    <text x="478" y="324" text-anchor="middle" class="font" font-size="11" fill="#64748B">上限: 30 步 · 200k Token · 死循环检测 · 退避重试</text>

    <!-- Model -->
    <rect x="330" y="392" width="296" height="62" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="478" y="419" text-anchor="middle" class="font" font-size="14.5" font-weight="700" fill="#17243B">Model（Mock / DashScope Qwen）</text>
    <text x="478" y="439" text-anchor="middle" class="font" font-size="11.5" fill="#64748B">Vercel AI SDK streamText() 统一协议抽象</text>
  </g>

  <!-- Bidirectional arrows agentLoop <-> Model -->
  <line x1="454" y1="340" x2="454" y2="386" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="416" y="369" text-anchor="middle" class="font" font-size="11" fill="#3158C9">发上下文</text>
  <line x1="502" y1="392" x2="502" y2="346" stroke="#64748B" stroke-width="2" marker-end="url(#arrow-slate)"/>
  <text x="540" y="369" text-anchor="middle" class="font" font-size="11" fill="#475569">流式事件</text>

  <!-- Bidirectional arrows agentLoop <-> ToolRegistry -->
  <line x1="626" y1="268" x2="684" y2="268" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="655" y="258" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#3158C9">call</text>
  <line x1="690" y1="298" x2="632" y2="298" stroke="#64748B" stroke-width="2" marker-end="url(#arrow-slate)"/>
  <text x="660" y="315" text-anchor="middle" class="mono" font-size="10.5" fill="#475569">result</text>

  <!-- Column 3: ToolRegistry -->
  <g filter="url(#card-shadow)">
    <rect x="690" y="122" width="194" height="310" rx="14" fill="#FFFFFF" stroke="#3158C9" stroke-width="2"/>
    <text x="787" y="152" text-anchor="middle" class="mono" font-size="15.5" font-weight="750" fill="#17243B">ToolRegistry</text>
    <text x="787" y="172" text-anchor="middle" class="font" font-size="12" fill="#64748B">工具策略与执行边界</text>

    <rect x="706" y="190" width="162" height="38" rx="8" fill="#F4F7FC" stroke="#DCE4F0"/>
    <text x="787" y="213" text-anchor="middle" class="font" font-size="12" font-weight="600" fill="#253653">1. Role 权限 + Profile</text>

    <rect x="706" y="238" width="162" height="38" rx="8" fill="#F4F7FC" stroke="#DCE4F0"/>
    <text x="787" y="261" text-anchor="middle" class="font" font-size="12" font-weight="600" fill="#253653">2. Bash 分级 + Pre Hook</text>

    <rect x="706" y="286" width="162" height="38" rx="8" fill="#F4F7FC" stroke="#DCE4F0"/>
    <text x="787" y="309" text-anchor="middle" class="font" font-size="12" font-weight="600" fill="#253653">3. 并发锁 / 独占锁</text>

    <rect x="706" y="334" width="162" height="38" rx="8" fill="#F4F7FC" stroke="#DCE4F0"/>
    <text x="787" y="357" text-anchor="middle" class="font" font-size="12" font-weight="600" fill="#253653">4. 3000字截断 + PostHook</text>

    <rect x="716" y="386" width="142" height="28" rx="14" fill="#EEF2FF" stroke="#C7D7FE"/>
    <text x="787" y="404" text-anchor="middle" class="font" font-size="11" font-weight="600" fill="#3158C9">tool_search 延迟发现</text>
  </g>

  <!-- Branch lines ToolRegistry -> 5 Tool Domains -->
  <line x1="884" y1="277" x2="908" y2="277" stroke="#4169E1" stroke-width="2"/>
  <path d="M 926 146 L 908 146 L 908 408 L 926 408" fill="none" stroke="#4169E1" stroke-width="1.8"/>
  <line x1="908" y1="146" x2="928" y2="146" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <line x1="908" y1="211" x2="928" y2="211" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <line x1="908" y1="277" x2="928" y2="277" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <line x1="908" y1="343" x2="928" y2="343" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <line x1="908" y1="408" x2="928" y2="408" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrow-blue)"/>

  <!-- Column 4: 5 Tool Domains -->
  <text x="934" y="106" class="font" font-size="12" font-weight="700" fill="#7183AD" letter-spacing="1">工具能力域</text>

  <g filter="url(#card-shadow)">
    <rect x="934" y="122" width="146" height="48" rx="9" fill="#FFFFFF" stroke="#DCE4F0" stroke-width="1.5"/>
    <text x="1007" y="143" text-anchor="middle" class="font" font-size="13" font-weight="700" fill="#17243B">文件 / Shell</text>
    <text x="1007" y="160" text-anchor="middle" class="mono" font-size="10.5" fill="#64748B">file · grep · bash</text>

    <rect x="934" y="187" width="146" height="48" rx="9" fill="#FFFFFF" stroke="#DCE4F0" stroke-width="1.5"/>
    <text x="1007" y="208" text-anchor="middle" class="font" font-size="13" font-weight="700" fill="#17243B">RAG / Memory</text>
    <text x="1007" y="225" text-anchor="middle" class="font" font-size="10.5" fill="#64748B">混合检索与长期记忆</text>

    <rect x="934" y="253" width="146" height="48" rx="9" fill="#FFFFFF" stroke="#DCE4F0" stroke-width="1.5"/>
    <text x="1007" y="274" text-anchor="middle" class="font" font-size="13" font-weight="700" fill="#17243B">MCP / Plugin</text>
    <text x="1007" y="291" text-anchor="middle" class="font" font-size="10.5" fill="#64748B">Mock GitHub / 插件</text>

    <rect x="934" y="319" width="146" height="48" rx="9" fill="#FFFFFF" stroke="#DCE4F0" stroke-width="1.5"/>
    <text x="1007" y="340" text-anchor="middle" class="font" font-size="13" font-weight="700" fill="#17243B">Cron 调度</text>
    <text x="1007" y="357" text-anchor="middle" class="mono" font-size="10.5" fill="#64748B">cron_manage</text>

    <rect x="934" y="384" width="146" height="48" rx="9" fill="#FFFFFF" stroke="#DCE4F0" stroke-width="1.5"/>
    <text x="1007" y="405" text-anchor="middle" class="font" font-size="13" font-weight="700" fill="#17243B">Sub-Agent</text>
    <text x="1007" y="422" text-anchor="middle" class="mono" font-size="10.5" fill="#64748B">spawn_agent</text>
  </g>

  <!-- Bottom Strip: Sidecar Observability -->
  <rect x="40" y="490" width="1040" height="114" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="60" y="518" class="font" font-size="12.5" font-weight="700" fill="#475569">旁路持久化记录（注：目前仅终端 CLI 主循环完整接入）</text>

  <rect x="60" y="534" width="316" height="52" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="76" y="556" class="font" font-size="13" font-weight="700" fill="#17243B">Session · <tspan class="mono" font-size="11.5" font-weight="500" fill="#3158C9">.sessions/*.jsonl</tspan></text>
  <text x="76" y="575" class="font" font-size="11.5" fill="#64748B">对话往来记录（当前只写不读，未接 --continue）</text>

  <rect x="396" y="534" width="328" height="52" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="412" y="556" class="font" font-size="13" font-weight="700" fill="#17243B">Trace · <tspan class="mono" font-size="11.5" font-weight="500" fill="#3158C9">.traces/*.jsonl</tspan></text>
  <text x="412" y="575" class="font" font-size="11.5" fill="#64748B">记录每步完整 System、Messages、耗时与报错</text>

  <rect x="744" y="534" width="316" height="52" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="760" y="556" class="font" font-size="13" font-weight="700" fill="#17243B">Usage · <tspan class="mono" font-size="11.5" font-weight="500" fill="#3158C9">.usage/today.jsonl</tspan></text>
  <text x="760" y="575" class="font" font-size="11.5" fill="#64748B">统计四类 Token、Cache 命中率与估算费用</text>
</svg>
