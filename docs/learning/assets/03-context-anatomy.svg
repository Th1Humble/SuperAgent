<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 530" width="100%" height="auto" role="img" aria-label="发给模型的完整上下文构成图">
  <defs>
    <style>
      .font { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Inter", -apple-system, BlinkMacSystemFont, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
    <filter id="s3" x="-4%" y="-4%" width="108%" height="114%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1C3152" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1118" height="528" rx="16" fill="#F8FAFF" stroke="#E3E9F2" stroke-width="1.5"/>

  <text x="40" y="42" class="font" font-size="22" font-weight="750" fill="#17243B">每次调用 streamText() 时，上下文窗口里装了什么</text>
  <text x="40" y="66" class="font" font-size="13" fill="#5D6A80">不只是聊天记录：System Prompt 按稳定性排好序以命中 Prompt Cache，后面跟着工具 Schema 和消息数组</text>

  <!-- Column 1: System Prompt -->
  <g filter="url(#s3)">
    <rect x="40" y="96" width="380" height="394" rx="14" fill="#FFFFFF" stroke="#4169E1" stroke-width="2"/>
    <text x="64" y="128" class="font" font-size="16" font-weight="750" fill="#1E3A8A">1. System Prompt</text>
    <text x="64" y="148" class="font" font-size="12" fill="#3158C9">由 PromptBuilder 管道从稳到变依次拼接</text>

    <!-- Stable Zone -->
    <rect x="62" y="164" width="336" height="128" rx="10" fill="#F0FDFA" stroke="#99F6E4"/>
    <text x="76" y="184" class="font" font-size="11" font-weight="700" fill="#0F766E">前部：高稳定区（最利于命中 Prompt Cache）</text>
    <rect x="76" y="194" width="308" height="26" rx="6" fill="#FFFFFF" stroke="#CCFBF1"/>
    <text x="90" y="211" class="mono" font-size="11.5" fill="#134E4A">coreRules      <tspan class="font" fill="#475569">核心行为规则</tspan></text>
    <rect x="76" y="226" width="308" height="26" rx="6" fill="#FFFFFF" stroke="#CCFBF1"/>
    <text x="90" y="243" class="mono" font-size="11.5" fill="#134E4A">toolGuide      <tspan class="font" fill="#475569">工具使用原则</tspan></text>
    <rect x="76" y="258" width="308" height="26" rx="6" fill="#FFFFFF" stroke="#CCFBF1"/>
    <text x="90" y="275" class="mono" font-size="11.5" fill="#134E4A">deferredTools  <tspan class="font" fill="#475569">延迟工具名称清单</tspan></text>

    <!-- Semi-dynamic Zone -->
    <rect x="62" y="302" width="336" height="84" rx="10" fill="#EFF4FF" stroke="#C7D7FE"/>
    <text x="76" y="322" class="font" font-size="11" font-weight="700" fill="#3158C9">中部：半动态知识索引</text>
    <rect x="76" y="332" width="308" height="22" rx="5" fill="#FFFFFF" stroke="#DBEAFE"/>
    <text x="90" y="347" class="mono" font-size="11" fill="#1E3A8A">memoryContext  <tspan class="font" fill="#475569">MEMORY.md 目录（非全文）</tspan></text>
    <rect x="76" y="358" width="308" height="22" rx="5" fill="#FFFFFF" stroke="#DBEAFE"/>
    <text x="90" y="373" class="mono" font-size="11" fill="#1E3A8A">ragContext     <tspan class="font" fill="#475569">知识库片段数与检索提示</tspan></text>

    <!-- Dynamic Zone -->
    <rect x="62" y="396" width="336" height="80" rx="10" fill="#FFFBEB" stroke="#FDE68A"/>
    <text x="76" y="416" class="font" font-size="11" font-weight="700" fill="#B45309">尾部：高频变化区（放最后免得缓存失效）</text>
    <rect x="76" y="426" width="308" height="20" rx="5" fill="#FFFFFF" stroke="#FEF3C7"/>
    <text x="90" y="440" class="mono" font-size="11" fill="#78350F">skillContext   <tspan class="font" fill="#475569">当前激活的 Skill 正文</tspan></text>
    <rect x="76" y="450" width="308" height="20" rx="5" fill="#FFFFFF" stroke="#FEF3C7"/>
    <text x="90" y="464" class="mono" font-size="11" fill="#78350F">sessionContext <tspan class="font" fill="#475569">Session ID 与消息信息</tspan></text>
  </g>

  <!-- Column 2: Tool Schemas -->
  <g filter="url(#s3)">
    <rect x="444" y="96" width="290" height="394" rx="14" fill="#FFFFFF" stroke="#DCE4F0" stroke-width="1.5"/>
    <text x="468" y="128" class="font" font-size="16" font-weight="750" fill="#17243B">2. Tool Schemas</text>
    <text x="468" y="148" class="font" font-size="12" fill="#64748B">本轮模型真正可见的工具说明书</text>

    <rect x="468" y="168" width="242" height="148" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="484" y="192" class="font" font-size="12.5" font-weight="700" fill="#17243B">必须过三道筛子才发给模型：</text>
    <text x="484" y="220" class="font" font-size="12" fill="#334155">1) 当前 Profile 匹配</text>
    <text x="484" y="246" class="font" font-size="12" fill="#334155">2) 非延迟 或 已被 tool_search 发现</text>
    <text x="484" y="272" class="font" font-size="12" fill="#334155">3) 当前 Role 角色允许使用</text>
    <text x="484" y="298" class="mono" font-size="11" fill="#3158C9">ToolRegistry.getActiveTools()</text>

    <rect x="468" y="336" width="242" height="132" rx="10" fill="#EEF2FF" stroke="#C7D7FE"/>
    <text x="484" y="362" class="font" font-size="12.5" font-weight="700" fill="#1E3A8A">为什么别把工具全塞进来？</text>
    <text x="484" y="388" class="font" font-size="12" fill="#3158C9">• 每个 JSON Schema 都吃输入 Token</text>
    <text x="484" y="412" class="font" font-size="12" fill="#3158C9">• 相似工具太多模型容易选错</text>
    <text x="484" y="438" class="font" font-size="12" fill="#3158C9">• 靠 shouldDefer: true 按需加载</text>
  </g>

  <!-- Column 3: Conversation Messages -->
  <g filter="url(#s3)">
    <rect x="758" y="96" width="322" height="394" rx="14" fill="#FFFFFF" stroke="#DCE4F0" stroke-width="1.5"/>
    <text x="782" y="128" class="font" font-size="16" font-weight="750" fill="#17243B">3. Conversation Messages</text>
    <text x="782" y="148" class="font" font-size="12" fill="#64748B">不断往后追加，最容易吃爆窗口的大户</text>

    <rect x="782" y="168" width="274" height="58" rx="9" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="798" y="192" class="mono" font-size="12" font-weight="700" fill="#17243B">role: "user" / "assistant"</text>
    <text x="798" y="212" class="font" font-size="11.5" fill="#64748B">用户输入与模型最终回答文本</text>

    <rect x="782" y="238" width="274" height="58" rx="9" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="798" y="262" class="mono" font-size="12" font-weight="700" fill="#3158C9">part: tool-call</text>
    <text x="798" y="282" class="font" font-size="11.5" fill="#64748B">模型请求调的工具名与 JSON 参数</text>

    <rect x="782" y="308" width="274" height="72" rx="9" fill="#FEF2F2" stroke="#FECACA"/>
    <text x="798" y="332" class="mono" font-size="12" font-weight="700" fill="#991B1B">part: tool-result（重点治理对象）</text>
    <text x="798" y="352" class="font" font-size="11.5" fill="#7F1D1D">读文件、抓网页返回的大段内容</text>
    <text x="798" y="369" class="font" font-size="11" fill="#B91C1C">默认 3000 字截断，并可被 defend 清理</text>

    <rect x="782" y="396" width="274" height="72" rx="9" fill="#F8FAFC" stroke="#CBD5E1" stroke-dasharray="5 3"/>
    <text x="798" y="420" class="font" font-size="12" font-weight="700" fill="#334155">诊断与压缩工具：</text>
    <text x="798" y="442" class="font" font-size="11.5" fill="#475569">• /context 可视化 16×16 矩阵</text>
    <text x="798" y="460" class="font" font-size="11.5" fill="#475569">• defend 防线 / microcompact / summarize</text>
  </g>
</svg>
