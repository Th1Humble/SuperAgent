<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 600" width="100%" height="auto" role="img" aria-label="RAG 混合检索完整流水线图">
  <defs>
    <style>
      .font { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Inter", -apple-system, BlinkMacSystemFont, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#4169E1"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0D9488"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#D97706"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1C3152" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Canvas -->
  <rect x="1" y="1" width="1158" height="598" rx="16" fill="#F8FAFF" stroke="#E3E9F2" stroke-width="1.5"/>

  <!-- Header -->
  <text x="36" y="42" class="font" font-size="22" font-weight="750" fill="#17243B">RAG 混合检索完整流水线</text>
  <text x="36" y="66" class="font" font-size="13" fill="#5D6A80">入库阶段把文档切块向量化存进内存；查询阶段走「向量 + BM25」双路召回，归一化融合后再经 MMR 去重</text>

  <!-- Top Band: Ingestion -->
  <rect x="32" y="90" width="1096" height="150" rx="14" fill="#FFFFFF" stroke="#DCE4F0" stroke-width="1.5"/>
  <text x="56" y="118" class="font" font-size="13" font-weight="700" fill="#3158C9">1. 入库阶段（启动自动扫描 docs/*.md 或手动调用 rag_ingest）</text>

  <g filter="url(#shadow)">
    <rect x="56" y="138" width="210" height="78" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="161" y="170" text-anchor="middle" class="font" font-size="14.5" font-weight="700" fill="#17243B">Markdown 原文</text>
    <text x="161" y="192" text-anchor="middle" class="font" font-size="11.5" fill="#64748B">docs/ 第一层 .md 文件</text>

    <rect x="322" y="138" width="230" height="78" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="437" y="170" text-anchor="middle" class="font" font-size="14.5" font-weight="700" fill="#17243B">chunkDocument() 切片</text>
    <text x="437" y="192" text-anchor="middle" class="font" font-size="11.5" fill="#64748B">顺着标题段落切分，约 256 tokens</text>

    <rect x="608" y="138" width="230" height="78" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="723" y="170" text-anchor="middle" class="font" font-size="14.5" font-weight="700" fill="#17243B">embed() 向量化</text>
    <text x="723" y="192" text-anchor="middle" class="font" font-size="11.5" fill="#64748B">Mock 确定性哈希 / DashScope API</text>

    <rect x="894" y="138" width="210" height="78" rx="10" fill="#EFF4FF" stroke="#4169E1" stroke-width="2"/>
    <text x="999" y="170" text-anchor="middle" class="font" font-size="14.5" font-weight="750" fill="#1E3A8A">VectorStore 内存索引</text>
    <text x="999" y="192" text-anchor="middle" class="font" font-size="11.5" fill="#3158C9">进程退出清空，重启后重建</text>
  </g>

  <line x1="266" y1="177" x2="316" y2="177" stroke="#4169E1" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="552" y1="177" x2="602" y2="177" stroke="#4169E1" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="838" y1="177" x2="888" y2="177" stroke="#4169E1" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Bottom Band: Query -->
  <rect x="32" y="264" width="1096" height="304" rx="14" fill="#FFFFFF" stroke="#DCE4F0" stroke-width="1.5"/>
  <text x="56" y="294" class="font" font-size="13" font-weight="700" fill="#3158C9">2. 查询阶段（模型按需调用 rag_search · Agentic RAG）</text>

  <!-- Start Query -->
  <g filter="url(#shadow)">
    <rect x="52" y="384" width="126" height="80" rx="10" fill="#F8FAFC" stroke="#4169E1" stroke-width="2"/>
    <text x="115" y="418" text-anchor="middle" class="font" font-size="14" font-weight="700" fill="#17243B">用户问题</text>
    <text x="115" y="439" text-anchor="middle" class="mono" font-size="11.5" fill="#3158C9">query string</text>
  </g>

  <!-- Branch Split -->
  <path d="M 178 424 L 196 424 L 196 355 L 210 355" fill="none" stroke="#0D9488" stroke-width="2" marker-end="url(#arr-teal)"/>
  <path d="M 178 424 L 196 424 L 196 493 L 210 493" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#arr-amber)"/>

  <!-- Upper Branch: Vector Path -->
  <text x="216" y="313" class="font" font-size="11.5" font-weight="700" fill="#0F766E">向量路径（擅长语义相近）</text>
  <g filter="url(#shadow)">
    <rect x="216" y="320" width="134" height="70" rx="9" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.5"/>
    <text x="283" y="350" text-anchor="middle" class="font" font-size="13" font-weight="700" fill="#134E4A">问题向量化</text>
    <text x="283" y="370" text-anchor="middle" class="mono" font-size="11" fill="#0F766E">embed([query])</text>

    <rect x="374" y="320" width="144" height="70" rx="9" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.5"/>
    <text x="446" y="350" text-anchor="middle" class="font" font-size="13" font-weight="700" fill="#134E4A">余弦相似度计算</text>
    <text x="446" y="370" text-anchor="middle" class="font" font-size="11" fill="#0F766E">取 Top 4×K 候选</text>

    <rect x="542" y="320" width="136" height="70" rx="9" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.5"/>
    <text x="610" y="350" text-anchor="middle" class="font" font-size="13" font-weight="700" fill="#134E4A">Min-Max 归一化</text>
    <text x="610" y="370" text-anchor="middle" class="font" font-size="11" fill="#0F766E">压缩到 [0, 1] 尺度</text>
  </g>
  <line x1="350" y1="355" x2="368" y2="355" stroke="#0D9488" stroke-width="2" marker-end="url(#arr-teal)"/>
  <line x1="518" y1="355" x2="536" y2="355" stroke="#0D9488" stroke-width="2" marker-end="url(#arr-teal)"/>

  <!-- Lower Branch: Keyword Path -->
  <text x="216" y="451" class="font" font-size="11.5" font-weight="700" fill="#B45309">关键词路径（擅长报错码、路径等精确匹配）</text>
  <g filter="url(#shadow)">
    <rect x="216" y="458" width="134" height="70" rx="9" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>
    <text x="283" y="488" text-anchor="middle" class="font" font-size="13" font-weight="700" fill="#78350F">文本分词</text>
    <text x="283" y="508" text-anchor="middle" class="mono" font-size="11" fill="#B45309">tokenize(query)</text>

    <rect x="374" y="458" width="144" height="70" rx="9" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>
    <text x="446" y="488" text-anchor="middle" class="font" font-size="13" font-weight="700" fill="#78350F">BM25 关键词打分</text>
    <text x="446" y="508" text-anchor="middle" class="font" font-size="11" fill="#B45309">取 Top 4×K 候选</text>

    <rect x="542" y="458" width="136" height="70" rx="9" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>
    <text x="610" y="488" text-anchor="middle" class="font" font-size="13" font-weight="700" fill="#78350F">Sigmoid 归一化</text>
    <text x="610" y="508" text-anchor="middle" class="font" font-size="11" fill="#B45309">压缩到 [0, 1] 尺度</text>
  </g>
  <line x1="350" y1="493" x2="368" y2="493" stroke="#D97706" stroke-width="2" marker-end="url(#arr-amber)"/>
  <line x1="518" y1="493" x2="536" y2="493" stroke="#D97706" stroke-width="2" marker-end="url(#arr-amber)"/>

  <!-- Merge into Hybrid Fusion -->
  <path d="M 678 355 L 698 355 L 698 424" fill="none" stroke="#0D9488" stroke-width="2"/>
  <path d="M 678 493 L 698 493 L 698 424" fill="none" stroke="#D97706" stroke-width="2"/>
  <line x1="698" y1="424" x2="714" y2="424" stroke="#4169E1" stroke-width="2" marker-end="url(#arr-blue)"/>

  <g filter="url(#shadow)">
    <rect x="720" y="384" width="138" height="80" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="789" y="418" text-anchor="middle" class="font" font-size="14" font-weight="700" fill="#17243B">加权融合</text>
    <text x="789" y="440" text-anchor="middle" class="font" font-size="11" fill="#475569">0.7×向量 + 0.3×BM25</text>

    <rect x="880" y="384" width="122" height="80" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="941" y="418" text-anchor="middle" class="font" font-size="13.5" font-weight="700" fill="#17243B">MMR 重排</text>
    <text x="941" y="440" text-anchor="middle" class="font" font-size="11" fill="#475569">λ=0.7 · Jaccard 去重</text>

    <rect x="1024" y="384" width="84" height="80" rx="10" fill="#4169E1"/>
    <text x="1066" y="419" text-anchor="middle" class="mono" font-size="14" font-weight="750" fill="#FFFFFF">Top K</text>
    <text x="1066" y="440" text-anchor="middle" class="font" font-size="11" fill="#E0E7FF">返回片段</text>
  </g>

  <line x1="858" y1="424" x2="874" y2="424" stroke="#4169E1" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="1002" y1="424" x2="1018" y2="424" stroke="#4169E1" stroke-width="2" marker-end="url(#arr-blue)"/>
</svg>
