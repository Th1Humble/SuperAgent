<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" width="100%" height="auto" role="img" aria-label="普通聊天 vs Agent Loop 闭环对比图">
  <defs>
    <style>
      .font { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Inter", -apple-system, BlinkMacSystemFont, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
    <marker id="arr-b1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#4169E1"/>
    </marker>
    <marker id="arr-g1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
    <marker id="arr-t1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0D9488"/>
    </marker>
    <filter id="s1" x="-4%" y="-4%" width="108%" height="114%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1C3152" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1118" height="498" rx="16" fill="#F8FAFF" stroke="#E3E9F2" stroke-width="1.5"/>

  <text x="40" y="42" class="font" font-size="22" font-weight="750" fill="#17243B">普通聊天程序 vs Agent Loop 闭环</text>
  <text x="40" y="66" class="font" font-size="13" fill="#5D6A80">区别不在模型本身，而在于代码是否允许模型在受控 while 循环里“调工具 → 看结果 → 再决策”</text>

  <!-- Left Panel: Normal Chat -->
  <rect x="36" y="92" width="320" height="372" rx="14" fill="#FFFFFF" stroke="#DCE4F0" stroke-width="1.5"/>
  <text x="60" y="124" class="font" font-size="16" font-weight="750" fill="#475569">普通聊天程序（单向直通）</text>
  <text x="60" y="145" class="font" font-size="12" fill="#94A3B8">一问一答，没有动手和反馈回路</text>

  <g filter="url(#s1)">
    <rect x="76" y="176" width="240" height="54" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="196" y="208" text-anchor="middle" class="font" font-size="14" font-weight="700" fill="#17243B">你的问题 (User Prompt)</text>

    <rect x="76" y="262" width="240" height="54" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="196" y="294" text-anchor="middle" class="font" font-size="14" font-weight="700" fill="#17243B">调用一次大模型</text>

    <rect x="76" y="348" width="240" height="54" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="196" y="380" text-anchor="middle" class="font" font-size="14" font-weight="700" fill="#475569">输出纯文本，直接结束</text>
  </g>
  <line x1="196" y1="230" x2="196" y2="256" stroke="#64748B" stroke-width="2" marker-end="url(#arr-g1)"/>
  <line x1="196" y1="316" x2="196" y2="342" stroke="#64748B" stroke-width="2" marker-end="url(#arr-g1)"/>
  <text x="196" y="436" text-anchor="middle" class="font" font-size="12" fill="#94A3B8">看不到本地文件，也不能中途纠偏</text>

  <!-- Right Panel: Agent Loop -->
  <rect x="380" y="92" width="704" height="372" rx="14" fill="#FFFFFF" stroke="#4169E1" stroke-width="2"/>
  <text x="408" y="124" class="font" font-size="16" font-weight="750" fill="#1E3A8A">Agent Loop（Think → Act → Observe 闭环）</text>
  <text x="408" y="145" class="font" font-size="12" fill="#3158C9">只要模型还在请求工具，循环就继续；直到不再调工具才收尾</text>

  <g filter="url(#s1)">
    <!-- Entry -->
    <rect x="406" y="196" width="134" height="72" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="473" y="227" text-anchor="middle" class="font" font-size="13.5" font-weight="700" fill="#17243B">用户任务</text>
    <text x="473" y="248" text-anchor="middle" class="mono" font-size="11" fill="#64748B">messages[]</text>

    <!-- 1. Think -->
    <rect x="582" y="168" width="224" height="72" rx="11" fill="#EFF4FF" stroke="#4169E1" stroke-width="2"/>
    <text x="694" y="196" text-anchor="middle" class="font" font-size="14.5" font-weight="750" fill="#1E3A8A">1. Think · 调用模型</text>
    <text x="694" y="218" text-anchor="middle" class="mono" font-size="11" fill="#3158C9">streamText({ system, tools, messages })</text>

    <!-- 2. Act -->
    <rect x="844" y="274" width="212" height="72" rx="11" fill="#FFFFFF" stroke="#3158C9" stroke-width="1.5"/>
    <text x="950" y="303" text-anchor="middle" class="font" font-size="14" font-weight="700" fill="#17243B">2. Act · 本地跑工具</text>
    <text x="950" y="324" text-anchor="middle" class="font" font-size="11.5" fill="#64748B">ToolRegistry 校验并执行</text>

    <!-- 3. Observe -->
    <rect x="582" y="302" width="224" height="72" rx="11" fill="#FFFFFF" stroke="#B8C9F8" stroke-width="1.5"/>
    <text x="694" y="330" text-anchor="middle" class="font" font-size="14" font-weight="700" fill="#17243B">3. Observe · 写回历史</text>
    <text x="694" y="352" text-anchor="middle" class="mono" font-size="11" fill="#3158C9">messages.push(...response.messages)</text>

    <!-- Exit -->
    <rect x="844" y="168" width="212" height="72" rx="11" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/>
    <text x="950" y="196" text-anchor="middle" class="font" font-size="14" font-weight="750" fill="#134E4A">输出最终回答并结束</text>
    <text x="950" y="218" text-anchor="middle" class="mono" font-size="11" fill="#0F766E">!hasToolCall → break</text>
  </g>

  <!-- Loop Arrows -->
  <line x1="540" y1="216" x2="576" y2="216" stroke="#4169E1" stroke-width="2" marker-end="url(#arr-b1)"/>
  <line x1="806" y1="204" x2="838" y2="204" stroke="#0D9488" stroke-width="2" marker-end="url(#arr-t1)"/>
  <text x="822" y="194" text-anchor="middle" class="font" font-size="10.5" font-weight="700" fill="#0F766E">无工具</text>

  <path d="M 744 240 L 744 260 L 950 260 L 950 268" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arr-b1)"/>
  <text x="848" y="254" text-anchor="middle" class="font" font-size="11" font-weight="700" fill="#3158C9">模型请求工具 (hasToolCall)</text>

  <path d="M 844 338 L 812 338" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arr-b1)"/>
  <path d="M 582 338 L 560 338 L 560 192 L 576 192" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arr-b1)"/>
  <text x="546" y="304" text-anchor="end" class="font" font-size="11" font-weight="700" fill="#3158C9">下一轮</text>

  <!-- Guardrails Footer -->
  <rect x="406" y="396" width="650" height="46" rx="9" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="731" y="424" text-anchor="middle" class="font" font-size="12" font-weight="600" fill="#475569">
    6 个刹车出口：正常答完 (!hasToolCall) · 30 步上限 · 200k Token 预算 · 死循环 critical 熔断 · AbortSignal · 不可重试错
  </text>
</svg>
